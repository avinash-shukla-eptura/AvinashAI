name: PR Auto Review (reusable)

# Reusable workflow: asks GitHub's built-in Copilot code review to review the PR
# on your behalf. Uses only the automatic GITHUB_TOKEN - no PAT/secret needed,
# since the actual review runs on GitHub's own hosted Copilot infrastructure.
# Called by a thin per-repo "caller" workflow (see .github/workflows/pr-review-caller.yml).
on:
  workflow_call: {}

permissions:
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request a review from Copilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]" \
            --silent
