name: Auto PR Review

# Triggers only when review is requested from this specific user, then asks
# GitHub's built-in Copilot code review to review on their behalf.
# To enable this in ANY OTHER repo: copy this file there unchanged - no secrets
# or tokens needed, it only uses the automatic GITHUB_TOKEN.
on:
  pull_request_target:
    types: [review_requested]

permissions:
  pull-requests: write

jobs:
  review:
    if: github.event.requested_reviewer.login == 'avinash-shukla-eptura'
    uses: avinash-shukla-eptura/AvinashAI/.github/workflows/pr-auto-review.yml@main
    permissions:
      pull-requests: write
